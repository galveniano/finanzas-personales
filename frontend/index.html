<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <link rel="icon" href="./icono.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="./apple-touch-icon.png" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#0e6b5c" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#161e1c" media="(prefers-color-scheme: dark)" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Finanzas" />
    <title>Finanzas</title>
    <!-- El tema guardado (lib/tema.ts) se aplica antes de cargar la app para que no parpadee -->
    <script>try{var t=localStorage.getItem('finanzas:tema');if(t==='oscuro'||t==='claro')document.documentElement.setAttribute('data-theme',t==='oscuro'?'dark':'light')}catch(e){}</script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
